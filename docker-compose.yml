services:
  spark-master:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-master
    user: root
    command: bash -c "/usr/local/spark/sbin/start-master.sh && tail -f /usr/local/spark/logs/*"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_NO_DAEMONIZE=false
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master port
    volumes:
      - ./data:/home/jovyan/data

  spark-worker-1:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-worker-1
    user: root
    command: bash -c "/usr/local/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /usr/local/spark/logs/*"
    environment:
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_NO_DAEMONIZE=false
    depends_on:
      - spark-master
    ports:
      - "8081:8081"   # Worker Web UI
    volumes:
      - ./data:/home/jovyan/data

  spark-worker-2:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-worker-2
    user: root
    command: bash -c "/usr/local/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /usr/local/spark/logs/*"
    environment:
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_NO_DAEMONIZE=false
    depends_on:
      - spark-master
    ports:
      - "8082:8081"   # Worker Web UI
    volumes:
      - ./data:/home/jovyan/data

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: jupyter
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_MASTER=spark://spark-master:7077
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
    ports:
      - "8888:8888"   # JupyterLab
      - "4040:4040"   # Spark Application UI
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # MinIO API
      - "9001:9001"   # MinIO Console
    volumes:
      - minio-data:/data

volumes:
  minio-data:
